<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Connection grants and task scope</title>
<desc id="desc">The example task summarizes a Slack discussion. Existing grants and the selected task scope overlap at reading the discussion. Sending messages is outside the task scope. A connection without a grant is outside existing access.</desc>
