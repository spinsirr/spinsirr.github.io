<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">One active home for a project</title>
  <desc id="desc">A duplicate laptop and devbox checkout can diverge. The final layout keeps the checkout and worktrees on the devbox, accessed from the laptop.</desc>
  <rect width="1200" height="675" fill="#f8f7f4"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202425">
    <text x="80" y="86" font-size="42" font-weight="700">One active home for a project</text>
    <text x="80" y="128" font-size="21" fill="#505857">Where the working state lives matters more than where its window appears.</text>
    <text x="80" y="202" font-size="20" font-weight="700" letter-spacing="2">TWO CHECKOUTS</text>
    <text x="650" y="202" font-size="20" font-weight="700" letter-spacing="2">ONE REMOTE CHECKOUT</text>
  </g>
  <g fill="none" stroke="#b9bdb9" stroke-width="2">
    <rect x="80" y="236" width="206" height="132" rx="5"/>
    <rect x="360" y="236" width="206" height="132" rx="5"/>
    <rect x="650" y="236" width="206" height="132" rx="5"/>
    <rect x="914" y="236" width="206" height="132" rx="5"/>
    <path d="M286 302h74" stroke="#c2775b" stroke-dasharray="7 8"/>
    <path d="M856 302h58" stroke="#558077"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202425">
    <text x="104" y="278" font-size="24" font-weight="700">Laptop</text>
    <text x="104" y="314" font-size="18">checkout A</text>
    <text x="104" y="343" font-size="16" fill="#5c6461">local edits</text>
    <text x="384" y="278" font-size="24" font-weight="700">Devbox</text>
    <text x="384" y="314" font-size="18">checkout B</text>
    <text x="384" y="343" font-size="16" fill="#5c6461">different local edits</text>
    <text x="674" y="278" font-size="24" font-weight="700">Laptop</text>
    <text x="674" y="314" font-size="18">client window</text>
    <text x="674" y="343" font-size="16" fill="#5c6461">no project copy</text>
    <text x="938" y="278" font-size="24" font-weight="700">Devbox</text>
    <text x="938" y="314" font-size="18">main checkout</text>
    <text x="938" y="343" font-size="16" fill="#5c6461">project runtime</text>
    <text x="80" y="411" font-size="19" fill="#a4563c">Which working tree wins?</text>
    <text x="650" y="411" font-size="19" fill="#3f7167">Client connects; state stays here.</text>
  </g>
  <g fill="none" stroke="#558077" stroke-width="2">
    <path d="M1017 368v76"/>
    <path d="M803 444h314"/>
    <path d="M803 444v34M960 444v34M1117 444v34"/>
    <rect x="745" y="478" width="116" height="78" rx="5"/>
    <rect x="902" y="478" width="116" height="78" rx="5"/>
    <rect x="1059" y="478" width="116" height="78" rx="5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#202425" font-size="16" text-anchor="middle">
    <text x="803" y="510">worktree</text><text x="803" y="535">task A</text>
    <text x="960" y="510">worktree</text><text x="960" y="535">task B</text>
    <text x="1117" y="510">worktree</text><text x="1117" y="535">task C</text>
  </g>
  <path d="M80 603h1040" stroke="#d5d8d3"/>
  <text x="80" y="639" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5c6461">Conceptual diagram based on the author's development setup · spinsirr.github.io</text>
</svg>
