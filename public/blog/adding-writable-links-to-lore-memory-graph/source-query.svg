<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Lore Memory Link authorization query</title>
  <desc id="desc">SQL from graph.ts selects and locks a source memory only when its target exists. Row-level security requires a writable source and a visible target.</desc>
  <rect width="900" height="720" fill="#f7f7f3"/>
  <rect x="67" y="63" width="7" height="37" fill="#345e71"/>
  <text x="94" y="91" fill="#3d5560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="600">LORE / GRAPH.TS</text>
  <text x="67" y="157" fill="#161e21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="47" font-weight="700">Memory Link write path</text>
  <line x1="67" y1="184" x2="833" y2="184" stroke="#bdc5c2" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#1e282b">
    <text x="71" y="238" fill="#8c9998">1</text><text x="129" y="238">SELECT source.id</text>
    <text x="71" y="279" fill="#8c9998">2</text><text x="129" y="279">FROM memories source</text>
    <text x="71" y="320" fill="#8c9998">3</text><text x="129" y="320">WHERE source.workspace_id = $1</text>
    <text x="71" y="361" fill="#8c9998">4</text><text x="159" y="361">AND source.id = $2</text>
    <text x="71" y="402" fill="#8c9998">5</text><text x="159" y="402">AND EXISTS (</text>
    <text x="71" y="443" fill="#8c9998">6</text><text x="189" y="443">SELECT 1 FROM memories target</text>
    <text x="71" y="484" fill="#8c9998">7</text><text x="189" y="484">WHERE target.workspace_id = $1</text>
    <text x="71" y="525" fill="#8c9998">8</text><text x="219" y="525">AND target.id = $3</text>
    <text x="71" y="566" fill="#8c9998">9</text><text x="159" y="566">)</text>
    <text x="59" y="607" fill="#8c9998">10</text><text x="129" y="607" fill="#345e71" font-weight="700">FOR NO KEY UPDATE</text>
  </g>
  <line x1="67" y1="644" x2="833" y2="644" stroke="#bdc5c2" stroke-width="2"/>
  <text x="67" y="680" fill="#5d6b6e" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21">Source: packages/lore-core/src/graph.ts · f1e60b5</text>
</svg>
