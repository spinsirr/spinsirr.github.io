<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Writable links in Lore's memory graph</title>
  <desc id="desc">A link write connects a writable source memory to a visible target memory using source, target, and kind as its key. A graph read capped at forty thousand links marks counts as lower bounds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#73c9c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="#0d1111"/>
  <text x="96" y="95" fill="#ebeeeb" font-family="Inter, Helvetica, Arial, sans-serif" font-size="53" font-weight="700">A link is a write, not just a line.</text>
  <text x="98" y="145" fill="#aab5b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26">Identity and visibility on write. Honest limits on read.</text>
  <line x1="800" y1="200" x2="800" y2="640" stroke="#34413e" stroke-width="2"/>

  <text x="96" y="232" fill="#73c9c2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">WRITE A LINK</text>
  <rect x="96" y="278" width="220" height="176" rx="18" fill="#17201f" stroke="#507b75" stroke-width="2"/>
  <circle cx="206" cy="330" r="22" fill="#73c9c2"/>
  <text x="206" y="339" text-anchor="middle" fill="#0d1111" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">S</text>
  <text x="206" y="386" text-anchor="middle" fill="#edf1ed" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="600">Source</text>
  <text x="206" y="423" text-anchor="middle" fill="#aab5b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">writable</text>
  <path d="M 329 365 H 516" stroke="#73c9c2" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="351" y="308" width="147" height="35" rx="17" fill="#2a4140"/>
  <text x="425" y="332" text-anchor="middle" fill="#b8e6df" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">supports</text>
  <rect x="531" y="278" width="220" height="176" rx="18" fill="#17201f" stroke="#507b75" stroke-width="2"/>
  <circle cx="641" cy="330" r="22" fill="#73c9c2"/>
  <text x="641" y="339" text-anchor="middle" fill="#0d1111" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">T</text>
  <text x="641" y="386" text-anchor="middle" fill="#edf1ed" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="600">Target</text>
  <text x="641" y="423" text-anchor="middle" fill="#aab5b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">visible</text>
  <rect x="96" y="492" width="655" height="116" rx="14" fill="#141c1b" stroke="#34413e" stroke-width="2"/>
  <text x="126" y="538" fill="#aab5b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21">Natural key</text>
  <text x="126" y="578" fill="#e6ece8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">(source, target, kind)</text>

  <text x="850" y="232" fill="#f2ad70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">READ THE GRAPH</text>
  <rect x="850" y="278" width="654" height="330" rx="18" fill="#17201f" stroke="#49514a" stroke-width="2"/>
  <text x="888" y="332" fill="#e6ece8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="600">Durable links returned</text>
  <text x="888" y="380" fill="#aab5b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23">Up to 40,000 per graph read</text>
  <rect x="888" y="418" width="553" height="22" rx="11" fill="#38413f"/>
  <rect x="888" y="418" width="553" height="22" rx="11" fill="#73c9c2"/>
  <line x1="1441" y1="406" x2="1441" y2="454" stroke="#f2ad70" stroke-width="3"/>
  <text x="888" y="500" fill="#f2ad70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">linksTruncated = true</text>
  <text x="888" y="548" fill="#e6ece8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25">Counts become lower bounds: N+</text>
  <line x1="96" y1="648" x2="1504" y2="648" stroke="#34413e" stroke-width="2"/>
  <text x="96" y="681" fill="#81908a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19">LORE MEMORY GRAPH · DESIGN SKETCH</text>
</svg>
