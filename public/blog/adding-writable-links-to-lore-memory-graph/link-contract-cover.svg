    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" viewBox="0 0 11 11"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#f3a26d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#64736e" opacity=".35"/></pattern>
  </defs>
  <rect width="1600" height="840" fill="#111716"/>
  <rect x="700" y="102" width="815" height="600" fill="url(#grid)"/>
