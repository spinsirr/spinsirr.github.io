<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Writable Memory Links in Lore</title>
  <desc id="desc">One directed supports link between a writable source memory and a visible target memory within a larger graph.</desc>
