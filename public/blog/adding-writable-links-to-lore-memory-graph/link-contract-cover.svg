    <circle cx="744" cy="531" r="9"/><circle cx="828" cy="575" r="9"/><circle cx="965" cy="549" r="9"/><circle cx="1097" cy="588" r="9"/><circle cx="1245" cy="542" r="9"/><circle cx="1412" cy="573" r="9"/><circle cx="1517" cy="526" r="9"/>
