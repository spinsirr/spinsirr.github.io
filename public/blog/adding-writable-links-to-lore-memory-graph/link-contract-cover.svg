  <text x="84" y="294" fill="#e4eeea" font-family="Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="700">Writable</text>
  <text x="84" y="384" fill="#e4eeea" font-family="Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="700">Memory Links</text>
  <text x="88" y="474" fill="#aebeb6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29">source · target · kind</text>
  <line x1="84" y1="654" x2="1516" y2="654" stroke="#52605b" stroke-width="2"/>

