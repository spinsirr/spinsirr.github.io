<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">One Memory Link, three PUT outcomes</title>
  <desc id="desc">An illustrative supports link goes from a writable decision to a visible evidence memory. A PUT creates it with weight 0.8 and returns 201. A PUT to the same key with weight 0.9 replaces it and returns 200. Repeating that state returns 200 without a write.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#bd4e2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1000" height="800" fill="#f5f0e7"/>
  <line x1="52" y1="93" x2="948" y2="93" stroke="#22332d" stroke-width="2"/>
  <text x="52" y="51" fill="#22332d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">MEMORY LINK / WRITE PATH</text>
  <text x="948" y="51" text-anchor="end" fill="#69746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">LORE · PR #129</text>

  <text x="52" y="142" fill="#69746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">ONE DIRECTED KEY</text>
  <rect x="52" y="167" width="325" height="152" rx="5" fill="#e4e9e0" stroke="#b5c0b3" stroke-width="2"/>
  <rect x="623" y="167" width="325" height="152" rx="5" fill="#f3dfd3" stroke="#d8a88f" stroke-width="2"/>
  <text x="76" y="207" fill="#536358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">SOURCE MEMORY</text>
  <text x="76" y="259" fill="#17251e" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Decision</text>
  <text x="76" y="294" fill="#455d4d" font-family="Arial, Helvetica, Arial, sans-serif" font-size="22">caller can edit</text>
  <text x="647" y="207" fill="#8f583f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">TARGET MEMORY</text>
  <text x="647" y="259" fill="#17251e" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Evidence</text>
  <text x="647" y="294" fill="#88543d" font-family="Arial, Helvetica, sans-serif" font-size="22">caller can see</text>
  <path d="M394 242 H603" fill="none" stroke="#bd4e2e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="500" y="220" text-anchor="middle" fill="#a74124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">supports</text>

  <rect x="52" y="342" width="896" height="66" fill="#22332d"/>
  <text x="76" y="383" fill="#b9c9bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">SAME LINK KEY</text>
  <text x="924" y="383" text-anchor="end" fill="#fbf7f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">(source, target, supports)</text>

  <text x="52" y="465" fill="#69746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">THREE CALLS TO THAT KEY</text>
  <line x1="52" y1="484" x2="948" y2="484" stroke="#aeb8ac" stroke-width="2"/>
  <line x1="351" y1="506" x2="351" y2="715" stroke="#c0c8bc" stroke-width="2"/>
  <line x1="650" y1="506" x2="650" y2="715" stroke="#c0c8bc" stroke-width="2"/>

  <text x="52" y="530" fill="#69746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">01 / PUT</text>
  <text x="52" y="584" fill="#22332d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">weight = 0.8</text>
  <text x="52" y="667" fill="#bd4e2e" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">201</text>
  <text x="52" y="703" fill="#22332d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CREATED</text>

  <text x="377" y="530" fill="#69746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">02 / PUT</text>
  <text x="377" y="584" fill="#22332d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">weight = 0.9</text>
  <text x="377" y="667" fill="#bd4e2e" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">200</text>
  <text x="377" y="703" fill="#22332d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">REPLACED</text>

  <text x="676" y="530" fill="#69746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">03 / PUT</text>
  <text x="676" y="584" fill="#22332d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26">weight = 0.9</text>
  <text x="676" y="667" fill="#69746d" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700">200</text>
  <text x="676" y="703" fill="#22332d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">NO WRITE</text>

  <line x1="52" y1="743" x2="948" y2="743" stroke="#22332d" stroke-width="2"/>
  <text x="52" y="777" fill="#69746d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">ILLUSTRATIVE VALUES · BEHAVIOR FROM LORE f1e60b5</text>
</svg>
