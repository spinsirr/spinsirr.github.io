<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Lore Memory Link write path</title>
  <desc id="desc">Selected SQL from Lore graph.ts showing the source row lock and target visibility check for Memory Link writes.</desc>
  <rect width="1600" height="840" fill="#f7f7f3"/>
  <rect x="92" y="100" width="8" height="43" fill="#345e71"/>
  <text x="124" y="132" fill="#3d5560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="29" font-weight="600">LORE / GRAPH.TS</text>
  <text x="92" y="290" fill="#161e21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">Memory Link</text>
  <text x="92" y="375" fill="#161e21" font-family="Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">write path</text>
  <line x1="92" y1="427" x2="608" y2="427" stroke="#bdc5c2" stroke-width="2"/>
  <text x="92" y="490" fill="#506166" font-family="Inter, Helvetica, Arial, sans-serif" font-size="31">Source must be writable.</text>
  <text x="92" y="541" fill="#506166" font-family="Inter, Helvetica, Arial, sans-serif" font-size="31">Target must be visible.</text>
  <line x1="652" y1="99" x2="652" y2="735" stroke="#bdc5c2" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#1e282b">
    <text x="706" y="157">SELECT source.id</text>
    <text x="706" y="216">FROM memories source</text>
    <text x="706" y="275">WHERE source.workspace_id = $1</text>
    <text x="746" y="334">AND source.id = $2</text>
    <text x="746" y="393">AND EXISTS (</text>
    <text x="786" y="452">SELECT 1 FROM memories target</text>
    <text x="786" y="511">WHERE target.workspace_id = $1</text>
    <text x="826" y="570">AND target.id = $3</text>
    <text x="746" y="629">)</text>
    <text x="706" y="688" fill="#345e71" font-weight="700">FOR NO KEY UPDATE</text>
  </g>
  <line x1="92" y1="735" x2="1508" y2="735" stroke="#bdc5c2" stroke-width="2"/>
  <text x="92" y="790" fill="#5d6b6e" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25">packages/lore-core/src/graph.ts · f1e60b5</text>
</svg>
