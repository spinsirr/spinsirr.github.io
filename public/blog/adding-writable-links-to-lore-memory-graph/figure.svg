<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030" role="img" aria-labelledby="title desc">
  <title id="title">Writable links in Lore's memory graph</title>
  <desc id="desc">A link write needs a writable source and a visible target. Its natural key is source, target, and kind. A graph read capped at forty thousand links reports its counts as lower bounds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#73c9c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="1030" fill="#0d1111"/>
  <text x="56" y="89" fill="#ebeeeb" font-family="Inter, Helvetica, Arial, sans-serif" font-size="53" font-weight="700">A link is a write.</text>
  <text x="58" y="136" fill="#aab5b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26">Identity on write. Honest limits on read.</text>

  <text x="56" y="215" fill="#73c9c2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">WRITE A LINK</text>
  <rect x="56" y="248" width="788" height="358" rx="18" fill="#17201f" stroke="#34413e" stroke-width="2"/>
  <rect x="92" y="283" width="250" height="178" rx="16" fill="#1b2927" stroke="#507b75" stroke-width="2"/>
  <circle cx="217" cy="338" r="24" fill="#73c9c2"/>
  <text x="217" y="347" text-anchor="middle" fill="#0d1111" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">S</text>
  <text x="217" y="395" text-anchor="middle" fill="#edf1ed" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="600">Source</text>
  <text x="217" y="433" text-anchor="middle" fill="#b2c3bd" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27">writable</text>
  <path d="M 357 373 H 539" stroke="#73c9c2" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="376" y="316" width="142" height="38" rx="18" fill="#2a4140"/>
  <text x="447" y="342" text-anchor="middle" fill="#b8e6df" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">supports</text>
  <rect x="558" y="283" width="250" height="178" rx="16" fill="#1b2927" stroke="#507b75" stroke-width="2"/>
  <circle cx="683" cy="338" r="24" fill="#73c9c2"/>
  <text x="683" y="347" text-anchor="middle" fill="#0d1111" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">T</text>
  <text x="683" y="395" text-anchor="middle" fill="#edf1ed" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="600">Target</text>
  <text x="683" y="433" text-anchor="middle" fill="#b2c3bd" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27">visible</text>
  <line x1="92" y1="493" x2="808" y2="493" stroke="#34413e" stroke-width="2"/>
  <text x="92" y="534" fill="#aab5b1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24">Natural key</text>
  <text x="92" y="574" fill="#e6ece8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">(source, target, kind)</text>

  <text x="56" y="690" fill="#f2ad70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3">READ THE GRAPH</text>
  <rect x="56" y="724" width="788" height="243" rx="18" fill="#17201f" stroke="#49514a" stroke-width="2"/>
  <text x="92" y="776" fill="#e6ece8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="31" font-weight="600">Up to 40,000 durable links</text>
  <rect x="92" y="807" width="716" height="24" rx="12" fill="#73c9c2"/>
  <line x1="808" y1="792" x2="808" y2="846" stroke="#f2ad70" stroke-width="4"/>
  <text x="92" y="886" fill="#f2ad70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">linksTruncated = true</text>
  <text x="92" y="932" fill="#e6ece8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28">Counts are lower bounds: N+</text>
  <text x="56" y="1005" fill="#81908a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21">LORE MEMORY GRAPH · DESIGN SKETCH</text>
</svg>
