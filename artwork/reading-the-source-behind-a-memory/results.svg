<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f7f5ef"/><g font-family="Arial, sans-serif" fill="#202a30"><text x="60" y="72" font-size="34" font-weight="700">Memory, source text, and the cost of search</text><text x="60" y="111" font-size="21">500 LongMemEval-S questions · same Memory hits and reader profile</text><text x="60" y="176" font-size="18">Evidence configuration</text><text x="450" y="176" font-size="18">Accuracy</text><text x="615" y="176" font-size="18">Storage / 1,000 sessions</text><text x="60" y="240" font-size="23">Memory only</text><text x="450" y="240" font-size="28" font-weight="700">84.4%</text><rect x="615" y="211" width="52.016460905349795" height="38" rx="3" fill="#778899"/><text x="682.0164609053498" y="240" font-size="21">32 MB</text><text x="60" y="348" font-size="23">+ source sessions</text><text x="450" y="348" font-size="28" font-weight="700">89.6%</text><rect x="615" y="319" width="61.769547325102884" height="38" rx="3" fill="#087f8c"/><text x="691.7695473251028" y="348" font-size="21">38 MB</text><text x="60" y="456" font-size="23">+ lexical + dense search</text><text x="450" y="456" font-size="28" font-weight="700">91.8%</text><rect x="615" y="427" width="395.0" height="38" rx="3" fill="#ac6137"/><text x="1025.0" y="456" font-size="21">243 MB</text><text x="60" y="548" font-size="18">Raw text adds 6 MB. Lexical indexing adds 51 MB. Dense indexing adds 154 MB.</text><text x="60" y="581" font-size="16">Source: Lore PR #150 · 1,536-dimension benchmark vectors · source-link overhead estimated</text></g></svg>